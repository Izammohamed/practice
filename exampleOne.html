

  <head>
    <title>Example One Page</title>
    <style>
      .header_one {
        color: green;
        font-size: 20px;
      }

      .image_styles {
        width: 100px;
        height: 100px;
      }

      .large_break {
        padding-top: 80px;
      }

      .small_break {
        padding-top: 30px;
      }

      .button_styles {
        width: 100px;
        height: 50px;
        background-color: blue;
        border: none;
        border-radius: 10px;
        color: white;
      }
    </style>
  </head>

  <body>
    <!-- section -->
    <div>
      <!-- large heading -->
      <h1 class="header_one">Large Heading</h1>

      <!-- medium  heading -->
      <h2 class="header_one">Medium Heading</h2>

      <!-- small heading -->
      <h3 class="header_one">Small Heading</h3>

      <!-- paragraph -->

      <p class="header_one">This is a para</p>

      <!-- sample image -->
      <img src="images/Rectangle 1.png" class="image_styles" />

      <!-- break -->

      <div class="large_break"></div>

      <!-- hr line -->
      <hr />

      <!-- small break -->
      <div class="small_break"></div>

      <!-- button -->

      <button class="button_styles">Submit</button>
    </div>
  </body>
</html>
